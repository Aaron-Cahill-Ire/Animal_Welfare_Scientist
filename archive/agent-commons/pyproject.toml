[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "welfare-agent-commons"
version = "0.1.0"
description = "Bounded, evidence-preserving animal welfare research tools"
requires-python = ">=3.9"

[project.scripts]
commons = "commons.cli:main"

[tool.setuptools.packages.find]
include = ["commons*"]
